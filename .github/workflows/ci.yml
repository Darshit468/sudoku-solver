name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -o sudoku solver.c
      - name: Run the self-check
        run: ./sudoku --check
